[project]
name = "kaggle-template"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dotenv>=0.9.9",
    "hydra-core>=1.3.2",
    "kaggle>=1.8.2",
    "kagglehub>=1.0.2",
    "lightgbm>=4.7.0",
    "matplotlib>=3.10.7",
    "numpy<2.0.0",
    "pandas>=2.3.3",
    "scikit-learn>=1.7.2",
    "seaborn>=0.13.2",
    "tqdm>=4.67.1",
    "wandb>=0.30.0",
]

[dependency-groups]
dev = [
    "ruff",
    "pytest",
    "ipykernel",
    "jupyterlab",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint.isort]
known-first-party = ["utils", "experiments"]
